<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resume Builder by LINS</title>
    <link rel="icon" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* BASE & VARIABLES */
        :root {
            --primary: #0A192F;
            --bg-color: #F9FAFB;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --success: #10B981;
            --warning: #F59E0B;
            --radius: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-serif: Georgia, Cambria, 'Times New Roman', Times, serif;
            
            /* Theme Colors */
            --theme-navy: #0A192F;
            --theme-royalblue: #2563EB;
            --theme-emerald: #10B981;
            --theme-purple: #7C3AED;
            --theme-orange: #F97316;
            --theme-red: #DC2626;
            --theme-teal: #0D9488;
            --theme-black: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
        body { background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }
        button { cursor: pointer; border: none; background: none; font-weight: 500; transition: all 0.2s; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: all 0.2s; background: var(--surface); }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1); }
        
        /* LAYOUT */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* HEADER */
        header.top-nav {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.25rem; color: var(--primary); }
        .brand img { height: 32px; width: auto; border-radius: 6px;}
        .nav-center { display: flex; align-items: center; gap: 1.5rem; }
        .status-badge { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); background: var(--bg-color); padding: 0.4rem 0.8rem; border-radius: 20px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .score-container { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 600; }
        .score-bar { width: 100px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .score-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease; }
        .nav-actions { display: flex; gap: 0.75rem; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; justify-content: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--bg-color); }

        /* MAIN WORKSPACE */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* EDITOR PANE */
        .editor-pane { width: 50%; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10;}
        .editor-header { padding: 1.5rem; border-bottom: 1px solid var(--border); background: #fafafa;}
        .editor-scroll { flex: 1; overflow-y: auto; padding: 1.5rem; }
        
        /* ACCORDIONS */
        .accordion { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1rem; background: white; box-shadow: var(--shadow-sm); overflow: hidden; }
        .accordion-header { width: 100%; padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; background: white; font-weight: 600; font-size: 1.05rem; }
        .accordion-header:hover { background: #fdfdfd; }
        .accordion-content { padding: 0 1.25rem; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
        .accordion.active .accordion-content { padding: 1.25rem; max-height: 2000px; border-top: 1px solid var(--border); }
        .accordion-icon { transition: transform 0.3s; }
        .accordion.active .accordion-icon { transform: rotate(180deg); }

        /* DYNAMIC FORMS */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        
        /* LIST ITEMS (Experience, etc) */
        .list-item { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: var(--bg-color); position: relative;}
        .list-item-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .btn-remove { color: var(--theme-red); font-size: 0.85rem; }
        .btn-add { width: 100%; padding: 0.75rem; border: 1px dashed var(--border); border-radius: 8px; color: var(--primary); font-weight: 600; background: transparent; }
        .btn-add:hover { background: var(--bg-color); border-color: var(--primary); }

        /* PREVIEW PANE */
        .preview-pane { width: 50%; background: #E5E7EB; display: flex; flex-direction: column; position: relative;}
        .preview-toolbar { padding: 0.75rem 1.5rem; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 20;}
        .tools-group { display: flex; gap: 0.5rem; align-items: center;}
        .preview-scroll { flex: 1; overflow: auto; padding: 2rem; display: flex; justify-content: center; align-items: flex-start; }
        
        /* A4 PAGE SIMULATION */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: var(--shadow-lg);
            margin: 0 auto;
            position: relative;
            transform-origin: top center;
            transition: transform 0.2s;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* PHOTO UPLOAD */
        .photo-upload { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .photo-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px dashed var(--border); background: var(--bg-color); display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        /* THEME SELECTOR */
        .color-selector, .template-selector { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-top: 0.5rem;}
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: var(--text-main); box-shadow: 0 0 0 2px white inset; }
        
        .tpl-card { border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; font-weight: 500;}
        .tpl-card.active { border-color: var(--primary); background: var(--primary); color: white; }

        /* TOAST NOTIFICATIONS */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; color: var(--text-main); padding: 1rem 1.5rem; border-radius: 8px; box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); font-weight: 500; font-size: 0.9rem;}
        .toast.show { transform: translateX(0); }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .workspace { flex-direction: column; overflow: auto; }
            .editor-pane, .preview-pane { width: 100%; flex: none; height: auto; }
            .preview-pane { min-height: 100vh; }
            body { overflow: auto; }
            .a4-page { transform: scale(0.6) !important; transform-origin: top left; margin: 0; }
            .preview-scroll { padding: 1rem; justify-content: flex-start; }
            .nav-center { display: none; }
        }

        /* -------------------------------------------------------------
           RESUME TEMPLATES ENGINE (12 Templates)
           ------------------------------------------------------------- */
        .resume-doc {
            --r-primary: var(--primary);
            --r-text: #333;
            --r-muted: #666;
            --r-bg: #fff;
            padding: 40px;
            color: var(--r-text);
            font-size: 10pt;
            line-height: 1.5;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-areas: "header" "main";
            gap: 20px;
        }
        
        /* Global Template Reset */
        .r-header, .r-sidebar, .r-content { display: none; }
        .r-header.has-data, .r-sidebar.has-data, .r-content.has-data { display: block; }
        
        .r-name { font-size: 24pt; font-weight: 700; color: var(--r-primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .r-title { font-size: 12pt; font-weight: 500; color: var(--r-muted); margin-bottom: 15px; }
        .r-contact { display: flex; flex-wrap: wrap; gap: 10px 20px; font-size: 9pt; color: var(--r-muted); }
        .r-contact span { display: flex; align-items: center; gap: 5px; }
        .r-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        
        .r-section { margin-bottom: 20px; }
        .r-section-title { font-size: 14pt; font-weight: 700; color: var(--r-primary); border-bottom: 2px solid var(--r-primary); padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase;}
        
        .r-item { margin-bottom: 15px; }
        .r-item-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px;}
        .r-item-title { font-weight: 700; font-size: 11pt; }
        .r-item-subtitle { font-weight: 600; font-style: italic; color: var(--r-muted); }
        .r-item-date { font-size: 9pt; color: var(--r-muted); }
        .r-item-desc { text-align: justify; }
        
        .r-pill-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .r-pill { background: #f3f4f6; color: #333; padding: 4px 10px; border-radius: 4px; font-size: 9pt; font-weight: 500; }

        /* Template 1: ATS Professional (Strict 1 column, clean, serif) */
        .tpl-ats { font-family: var(--font-serif); }
        .tpl-ats .r-photo { display: none; }
        .tpl-ats .r-name { text-transform: none; font-size: 28pt; text-align: center; }
        .tpl-ats .r-title { text-align: center; }
        .tpl-ats .r-contact { justify-content: center; margin-bottom: 20px;}
        .tpl-ats .r-section-title { border-bottom: 1px solid #000; color: #000; text-transform: none; }

        /* Template 2: Modern Corporate (2 Columns) */
        .tpl-modern { grid-template-columns: 2fr 1fr; grid-template-areas: "header header" "main sidebar"; }
        .tpl-modern .r-header { grid-area: header; border-bottom: 2px solid var(--r-primary); padding-bottom: 20px; }
        .tpl-modern .r-content { grid-area: main; padding-right: 20px; border-right: 1px solid #eee; }
        .tpl-modern .r-sidebar { grid-area: sidebar; padding-left: 20px; }

        /* Template 3: Executive Luxury */
        .tpl-executive { font-family: var(--font-serif); background: #fafafa; border: 15px solid #fff; box-shadow: inset 0 0 0 1px #ddd;}
        .tpl-executive .r-header { text-align: center; margin-bottom: 30px; }
        .tpl-executive .r-contact { justify-content: center; }
        .tpl-executive .r-section-title { text-align: center; border-bottom: none; }
        .tpl-executive .r-section-title::after { content: ""; display: block; width: 40px; height: 2px; background: var(--r-primary); margin: 5px auto 0; }

        /* Template 4: Minimal Clean */
        .tpl-minimal { font-family: var(--font-sans); color: #444; }
        .tpl-minimal .r-name { font-weight: 300; letter-spacing: 2px; }
        .tpl-minimal .r-section-title { border: none; font-weight: 600; letter-spacing: 1px; color: #888; }
        .tpl-minimal .r-item-header { flex-direction: column; }

        /* Template 5: Creative Designer (Colored Sidebar) */
        .tpl-creative { grid-template-columns: 250px 1fr; grid-template-areas: "sidebar main"; padding: 0; gap: 0; min-height: 297mm;}
        .tpl-creative .r-sidebar { grid-area: sidebar; background: var(--r-primary); color: white; padding: 40px 30px; }
        .tpl-creative .r-content { grid-area: main; padding: 40px; }
        .tpl-creative .r-header { grid-area: main; padding: 40px 40px 0 40px; }
        .tpl-creative .r-sidebar .r-section-title { color: white; border-color: rgba(255,255,255,0.3); }
        .tpl-creative .r-sidebar .r-muted, .tpl-creative .r-sidebar .r-contact { color: rgba(255,255,255,0.8); }
        .tpl-creative .r-pill { background: rgba(255,255,255,0.2); color: white;}
        .tpl-creative .r-photo { border: 4px solid rgba(255,255,255,0.2); margin-bottom: 20px;}

        /* Template 6: Sidebar Professional (Right sidebar) */
        .tpl-sidebar-pro { grid-template-columns: 1fr 220px; grid-template-areas: "header header" "main sidebar"; }
        .tpl-sidebar-pro .r-header { grid-area: header; background: #f8f9fa; padding: 30px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 30px;}
        .tpl-sidebar-pro .r-content { grid-area: main; padding-right: 20px; }
        .tpl-sidebar-pro .r-sidebar { grid-area: sidebar; }

        /* Template 7: Startup Founder */
        .tpl-startup { font-family: var(--font-sans); }
        .tpl-startup .r-name { font-weight: 900; font-size: 32pt; line-height: 1; margin-bottom: 10px; }
        .tpl-startup .r-section-title { border-bottom: 4px solid var(--r-primary); display: inline-block; padding-bottom: 2px; }

        /* Template 8: Tech Engineer (Monospace touches) */
        .tpl-tech { font-family: var(--font-sans); }
        .tpl-tech .r-section-title { background: #f0f4f8; padding: 5px 10px; border-left: 4px solid var(--r-primary); border-bottom: none;}
        .tpl-tech .r-item-date { font-family: monospace; font-size: 10pt; color: var(--r-primary); }

        /* Template 9: Elegant Executive */
        .tpl-elegant { grid-template-columns: 1fr; text-align: center; }
        .tpl-elegant .r-header { border-bottom: 1px solid #ccc; padding-bottom: 20px; }
        .tpl-elegant .r-item { text-align: left; }
        .tpl-elegant .r-item-header { border-bottom: 1px dotted #eee; padding-bottom: 5px;}

        /* Template 10: Consultant */
        .tpl-consultant { grid-template-columns: 60px 1fr; grid-template-areas: "sidebar main"; gap: 30px; }
        .tpl-consultant .r-header { grid-area: main; }
        .tpl-consultant .r-content { grid-area: main; }
        .tpl-consultant .r-sidebar { grid-area: sidebar; background: var(--r-primary); }
        .tpl-consultant .r-sidebar * { display: none; } /* Just a visual bar */

        /* Template 11: Product Manager */
        .tpl-pm .r-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--r-primary); padding-bottom: 10px; margin-bottom: 20px;}
        .tpl-pm .r-contact { flex-direction: column; align-items: flex-end; gap: 2px;}

        /* Template 12: International CV */
        .tpl-intl { grid-template-columns: 1fr; font-size: 9.5pt; }
        .tpl-intl .r-photo { width: 120px; height: 150px; border-radius: 0; float: right; margin-left: 20px;}
        .tpl-intl .r-item-header { flex-direction: row; }
        .tpl-intl .r-section-title { background: var(--r-primary); color: white; padding: 4px 10px; }
        
    </style>
</head>
<body>

<div class="app-container">
    <header class="top-nav">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Resume Builder <span style="font-weight: 400; color: var(--text-muted); font-size: 0.9rem;">by LINS</span>
        </div>
        
        <div class="nav-center">
            <div class="score-container" title="Resume Completion Score">
                Health Score: <span id="health-score-text">0%</span>
                <div class="score-bar"><div class="score-fill" id="health-score-fill"></div></div>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="save-dot"></div>
                <span id="save-text">Saved locally</span>
            </div>
            <div class="nav-actions">
                <button class="btn btn-secondary" onclick="app.undo()" title="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg></button>
                <button class="btn btn-secondary" onclick="app.redo()" title="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg></button>
                <select id="export-quality" style="width: auto; padding: 0.4rem; height: 35px; margin-right: 5px;">
                    <option value="1">Standard Quality</option>
                    <option value="2" selected>High Quality</option>
                    <option value="3">Print Quality</option>
                </select>
                <button class="btn btn-primary" onclick="app.exportPDF()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Export
                </button>
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="editor-pane">
            <div class="editor-header">
                <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">Template & Theme</h2>
                
                <div class="form-label">Select Theme Color</div>
                <div class="color-selector" id="color-selector">
                    </div>

                <div class="form-label" style="margin-top: 1rem;">Select Template</div>
                <div class="template-selector" id="template-selector">
                    </div>
            </div>

            <div class="editor-scroll" id="editor-forms">
                </div>
        </div>

        <div class="preview-pane">
            <div class="preview-toolbar">
                <div class="tools-group">
                    <button class="btn btn-secondary" onclick="app.zoom(-0.1)">-</button>
                    <span id="zoom-level" style="font-size: 0.9rem; width: 40px; text-align: center;">100%</span>
                    <button class="btn btn-secondary" onclick="app.zoom(0.1)">+</button>
                </div>
                <div class="tools-group">
                    <button class="btn btn-secondary" onclick="app.exportImage('png')">PNG</button>
                    <button class="btn btn-secondary" onclick="app.exportImage('jpg')">JPG</button>
                </div>
            </div>
            <div class="preview-scroll">
                <div class="a4-page" id="resume-container">
                    </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
/**
 * RESUME BUILDER LOGIC
 * Single-file pure Vanilla JS architecture.
 */

const THEMES = [
    { id: 'navy', hex: '#0A192F' },
    { id: 'royalblue', hex: '#2563EB' },
    { id: 'emerald', hex: '#10B981' },
    { id: 'purple', hex: '#7C3AED' },
    { id: 'orange', hex: '#F97316' },
    { id: 'red', hex: '#DC2626' },
    { id: 'teal', hex: '#0D9488' },
    { id: 'black', hex: '#000000' }
];

const TEMPLATES = [
    { id: 'ats', name: 'ATS Professional' },
    { id: 'modern', name: 'Modern Corporate' },
    { id: 'executive', name: 'Executive Luxury' },
    { id: 'minimal', name: 'Minimal Clean' },
    { id: 'creative', name: 'Creative Designer' },
    { id: 'sidebar-pro', name: 'Sidebar Professional' },
    { id: 'startup', name: 'Startup Founder' },
    { id: 'tech', name: 'Tech Engineer' },
    { id: 'elegant', name: 'Elegant Executive' },
    { id: 'consultant', name: 'Consultant' },
    { id: 'pm', name: 'Product Manager' },
    { id: 'intl', name: 'International CV' }
];

// Schema for generating the 11 forms dynamically
const SCHEMA = [
    {
        id: 'personal', title: '1. Personal Information', type: 'object',
        fields: [
            { id: 'photo', label: 'Profile Photo', type: 'file' },
            { id: 'fullName', label: 'Full Name', type: 'text' },
            { id: 'jobTitle', label: 'Job Title', type: 'text' },
            { id: 'email', label: 'Email Address', type: 'email' },
            { id: 'phone', label: 'Phone Number', type: 'text' },
            { id: 'location', label: 'Location', type: 'text' },
            { id: 'linkedin', label: 'LinkedIn URL', type: 'text' },
            { id: 'website', label: 'Website / Portfolio', type: 'text' }
        ]
    },
    {
        id: 'summary', title: '2. Professional Summary', type: 'object',
        fields: [{ id: 'text', label: 'Summary', type: 'textarea', placeholder: 'Write a compelling professional summary...' }]
    },
    {
        id: 'experience', title: '3. Work Experience', type: 'list', itemTitle: 'company',
        fields: [
            { id: 'company', label: 'Company Name', type: 'text' },
            { id: 'role', label: 'Job Title', type: 'text' },
            { id: 'dates', label: 'Dates (e.g. Jan 2020 - Present)', type: 'text' },
            { id: 'location', label: 'Location', type: 'text' },
            { id: 'desc', label: 'Description / Achievements', type: 'textarea' }
        ]
    },
    {
        id: 'education', title: '4. Education', type: 'list', itemTitle: 'school',
        fields: [
            { id: 'school', label: 'School / University', type: 'text' },
            { id: 'degree', label: 'Degree / Field of Study', type: 'text' },
            { id: 'dates', label: 'Dates', type: 'text' },
            { id: 'desc', label: 'Details / GPA', type: 'textarea' }
        ]
    },
    {
        id: 'skills', title: '5. Skills', type: 'object',
        fields: [{ id: 'text', label: 'Skills (Comma separated)', type: 'textarea', placeholder: 'JavaScript, Project Management, Sales...' }]
    },
    {
        id: 'certifications', title: '6. Certifications', type: 'list', itemTitle: 'name',
        fields: [
            { id: 'name', label: 'Certification Name', type: 'text' },
            { id: 'issuer', label: 'Issuer', type: 'text' },
            { id: 'year', label: 'Year', type: 'text' }
        ]
    },
    {
        id: 'languages', title: '7. Languages', type: 'list', itemTitle: 'name',
        fields: [
            { id: 'name', label: 'Language', type: 'text' },
            { id: 'level', label: 'Proficiency (e.g. Native, Fluent, B2)', type: 'text' }
        ]
    },
    {
        id: 'projects', title: '8. Projects', type: 'list', itemTitle: 'name',
        fields: [
            { id: 'name', label: 'Project Name', type: 'text' },
            { id: 'link', label: 'Project Link', type: 'text' },
            { id: 'desc', label: 'Description', type: 'textarea' }
        ]
    },
    {
        id: 'achievements', title: '9. Achievements', type: 'list', itemTitle: 'name',
        fields: [
            { id: 'name', label: 'Achievement / Award Name', type: 'text' },
            { id: 'year', label: 'Year', type: 'text' },
            { id: 'desc', label: 'Description', type: 'textarea' }
        ]
    },
    {
        id: 'references', title: '10. References', type: 'list', itemTitle: 'name',
        fields: [
            { id: 'name', label: 'Reference Name', type: 'text' },
            { id: 'company', label: 'Company / Role', type: 'text' },
            { id: 'contact', label: 'Contact Info', type: 'text' }
        ]
    },
    {
        id: 'hobbies', title: '11. Hobbies & Interests', type: 'object',
        fields: [{ id: 'text', label: 'Hobbies (Comma separated)', type: 'textarea' }]
    }
];

const DEFAULT_DATA = {
    settings: { theme: 'navy', template: 'modern' },
    personal: { fullName: '', jobTitle: '', email: '', phone: '', location: '', linkedin: '', website: '', photo: '' },
    summary: { text: '' },
    experience: [], education: [], skills: { text: '' }, certifications: [], languages: [], projects: [], achievements: [], references: [], hobbies: { text: '' }
};

class ResumeApp {
    constructor() {
        this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        this.history = [];
        this.historyIndex = -1;
        this.zoomLevel = 1;
        this.saveTimeout = null;

        this.init();
    }

    init() {
        this.loadData();
        this.renderThemeSelector();
        this.renderTemplateSelector();
        this.renderEditorForms();
        this.saveState(); // Initial state for undo/redo
        this.updatePreview();
        this.calculateScore();
        this.showToast('App loaded successfully');
    }

    // --- STATE MANAGEMENT ---
    loadData() {
        const stored = localStorage.getItem('lins_resume_data');
        if (stored) {
            try {
                this.data = { ...DEFAULT_DATA, ...JSON.parse(stored) };
            } catch (e) { console.error('Data corrupt'); }
        }
    }

    saveData() {
        localStorage.setItem('lins_resume_data', JSON.stringify(this.data));
        this.indicateSave();
    }

    indicateSave() {
        const dot = document.getElementById('save-dot');
        const text = document.getElementById('save-text');
        dot.style.background = var('--warning');
        text.innerText = 'Saving...';
        
        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => {
            this.saveData();
            dot.style.background = 'var(--success)';
            text.innerText = 'Saved locally';
            this.calculateScore();
        }, 1000);
    }

    handleChange(section, id, value, isList = false, listIndex = 0) {
        if (isList) {
            this.data[section][listIndex][id] = value;
        } else {
            this.data[section][id] = value;
        }
        this.updatePreview();
        this.indicateSave();
        this.debounceSaveState();
    }

    // Undo / Redo System
    saveState() {
        // Drop future states if we are not at the end
        if (this.historyIndex < this.history.length - 1) {
            this.history = this.history.slice(0, this.historyIndex + 1);
        }
        this.history.push(JSON.stringify(this.data));
        if (this.history.length > 20) this.history.shift(); // Limit history
        else this.historyIndex++;
    }

    debounceSaveState() {
        clearTimeout(this.stateTimeout);
        this.stateTimeout = setTimeout(() => this.saveState(), 1500);
    }

    undo() {
        if (this.historyIndex > 0) {
            this.historyIndex--;
            this.data = JSON.parse(this.history[this.historyIndex]);
            this.fullReRender();
            this.showToast('Undo successful');
        }
    }

    redo() {
        if (this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this.data = JSON.parse(this.history[this.historyIndex]);
            this.fullReRender();
            this.showToast('Redo successful');
        }
    }

    fullReRender() {
        this.renderEditorForms();
        this.renderThemeSelector();
        this.renderTemplateSelector();
        this.updatePreview();
        this.saveData();
    }

    // --- UI GENERATION ---
    renderThemeSelector() {
        const container = document.getElementById('color-selector');
        container.innerHTML = THEMES.map(t => 
            `<div class="color-btn ${this.data.settings.theme === t.id ? 'active' : ''}" 
                  style="background-color: ${t.hex}" 
                  onclick="app.setTheme('${t.id}')" title="${t.id}"></div>`
        ).join('');
    }

    renderTemplateSelector() {
        const container = document.getElementById('template-selector');
        container.innerHTML = TEMPLATES.map(t => 
            `<div class="tpl-card ${this.data.settings.template === t.id ? 'active' : ''}" 
                  onclick="app.setTemplate('${t.id}')">${t.name}</div>`
        ).join('');
    }

    setTheme(id) {
        this.data.settings.theme = id;
        this.renderThemeSelector();
        this.updatePreview();
        this.saveData();
        this.saveState();
    }

    setTemplate(id) {
        this.data.settings.template = id;
        this.renderTemplateSelector();
        this.updatePreview();
        this.saveData();
        this.saveState();
    }

    renderEditorForms() {
        const container = document.getElementById('editor-forms');
        container.innerHTML = SCHEMA.map((schema, index) => this.generateAccordion(schema, index)).join('');
    }

    toggleAccordion(el) {
        el.parentElement.classList.toggle('active');
    }

    generateAccordion(schema, index) {
        const isActive = index === 0 ? 'active' : '';
        let content = '';

        if (schema.type === 'object') {
            content = `<div class="form-grid">` + schema.fields.map(f => this.generateField(schema.id, f)).join('') + `</div>`;
        } else if (schema.type === 'list') {
            const items = this.data[schema.id] || [];
            content = `<div id="list-container-${schema.id}">` + 
                      items.map((item, i) => this.generateListItem(schema, i, item)).join('') + 
                      `</div>
                      <button class="btn-add" onclick="app.addListItem('${schema.id}')">+ Add ${schema.title.split(' ')[1]}</button>`;
        }

        return `
            <div class="accordion ${isActive}">
                <button class="accordion-header" onclick="app.toggleAccordion(this)">
                    ${schema.title}
                    <svg class="accordion-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="accordion-content">${content}</div>
            </div>
        `;
    }

    generateField(section, field, isList = false, listIndex = 0, valueOverride = null) {
        const value = valueOverride !== null ? valueOverride : (this.data[section][field.id] || '');
        const onChange = `app.handleChange('${section}', '${field.id}', this.value, ${isList}, ${listIndex})`;
        const fullClass = field.type === 'textarea' || field.id === 'fullName' ? 'full' : '';

        if (field.type === 'file') {
            const imgSrc = this.data[section][field.id] || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%239ca3af" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
            return `
                <div class="form-group full">
                    <label class="form-label">${field.label}</label>
                    <div class="photo-upload">
                        <div class="photo-preview"><img src="${imgSrc}" id="photo-preview-img"/></div>
                        <div>
                            <input type="file" accept="image/jpeg, image/png" onchange="app.handlePhotoUpload(this)" style="display:none" id="photo-upload-input">
                            <button class="btn btn-secondary" onclick="document.getElementById('photo-upload-input').click()">Upload Photo</button>
                            <button class="btn btn-secondary" style="color:var(--theme-red); border:none;" onclick="app.removePhoto()">Remove</button>
                        </div>
                    </div>
                </div>
            `;
        }

        let inputHtml = '';
        if (field.type === 'textarea') {
            inputHtml = `<textarea rows="4" placeholder="${field.placeholder || ''}" oninput="${onChange}">${value}</textarea>`;
        } else {
            inputHtml = `<input type="${field.type}" placeholder="${field.placeholder || ''}" value="${value}" oninput="${onChange}">`;
        }

        return `
            <div class="form-group ${fullClass}">
                <label class="form-label">${field.label}</label>
                ${inputHtml}
            </div>
        `;
    }

    generateListItem(schema, index, itemData) {
        const titleField = schema.itemTitle;
        const title = itemData[titleField] || `New Entry`;
        
        const fieldsHtml = schema.fields.map(f => this.generateField(schema.id, f, true, index, itemData[f.id])).join('');

        return `
            <div class="list-item">
                <div class="list-item-header">
                    <strong>${title}</strong>
                    <button class="btn-remove" onclick="app.removeListItem('${schema.id}', ${index})">Remove</button>
                </div>
                <div class="form-grid">${fieldsHtml}</div>
            </div>
        `;
    }

    addListItem(section) {
        if (!this.data[section]) this.data[section] = [];
        this.data[section].push({});
        this.renderEditorForms();
        this.saveState();
        this.updatePreview();
    }

    removeListItem(section, index) {
        if(confirm('Remove this entry?')) {
            this.data[section].splice(index, 1);
            this.renderEditorForms();
            this.saveState();
            this.updatePreview();
        }
    }

    handlePhotoUpload(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                // Compress via canvas to save LocalStorage space
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 400;
                    let w = img.width, h = img.height;
                    if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
                    else if (h > MAX) { w *= MAX / h; h = MAX; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/jpeg', 0.8);
                    
                    this.data.personal.photo = compressed;
                    document.getElementById('photo-preview-img').src = compressed;
                    this.updatePreview();
                    this.saveData();
                    this.saveState();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    removePhoto() {
        this.data.personal.photo = '';
        this.renderEditorForms();
        this.updatePreview();
        this.saveData();
        this.saveState();
    }

    // --- PREVIEW RENDERER ---
    updatePreview() {
        const c = document.getElementById('resume-container');
        const themeHex = THEMES.find(t => t.id === this.data.settings.theme)?.hex || '#0A192F';
        
        c.className = `a4-page resume-doc tpl-${this.data.settings.template}`;
        c.style.setProperty('--r-primary', themeHex);

        const d = this.data;
        const p = d.personal;
        
        // Build contact HTML
        let contactHtml = '';
        if(p.email) contactHtml += `<span>✉️ ${p.email}</span>`;
        if(p.phone) contactHtml += `<span>📱 ${p.phone}</span>`;
        if(p.location) contactHtml += `<span>📍 ${p.location}</span>`;
        if(p.linkedin) contactHtml += `<span>🔗 ${p.linkedin}</span>`;
        if(p.website) contactHtml += `<span>🌐 ${p.website}</span>`;

        // Section builder helper
        const buildSection = (title, content, hasData) => hasData ? `<div class="r-section"><div class="r-section-title">${title}</div>${content}</div>` : '';
        const buildPills = (str) => str ? `<div class="r-pill-list">` + str.split(',').map(s=>`<span class="r-pill">${s.trim()}</span>`).join('') + `</div>` : '';

        // Lists builder
        const buildList = (arr, tplFunc) => arr && arr.length > 0 ? arr.map(tplFunc).join('') : '';

        // Generate Main Content
        const summaryHtml = buildSection('Professional Summary', `<div class="r-item-desc">${d.summary.text}</div>`, d.summary.text.length > 0);
        
        const expHtml = buildSection('Experience', buildList(d.experience, i => `
            <div class="r-item">
                <div class="r-item-header">
                    <span class="r-item-title">${i.role || ''} <span class="r-item-subtitle">${i.company ? '| '+i.company : ''}</span></span>
                    <span class="r-item-date">${i.dates || ''} ${i.location ? '· '+i.location : ''}</span>
                </div>
                <div class="r-item-desc">${(i.desc || '').replace(/\n/g, '<br>')}</div>
            </div>
        `), d.experience.length > 0);

        const eduHtml = buildSection('Education', buildList(d.education, i => `
            <div class="r-item">
                <div class="r-item-header">
                    <span class="r-item-title">${i.degree || ''} <span class="r-item-subtitle">${i.school ? '| '+i.school : ''}</span></span>
                    <span class="r-item-date">${i.dates || ''}</span>
                </div>
                <div class="r-item-desc">${(i.desc || '').replace(/\n/g, '<br>')}</div>
            </div>
        `), d.education.length > 0);

        const projHtml = buildSection('Projects', buildList(d.projects, i => `
            <div class="r-item">
                <div class="r-item-header">
                    <span class="r-item-title">${i.name || ''} ${i.link ? `<a href="${i.link}" style="color:var(--r-primary);font-size:9pt;text-decoration:none;">🔗</a>` : ''}</span>
                </div>
                <div class="r-item-desc">${(i.desc || '').replace(/\n/g, '<br>')}</div>
            </div>
        `), d.projects.length > 0);

        const achHtml = buildSection('Achievements', buildList(d.achievements, i => `
            <div class="r-item" style="margin-bottom:8px;">
                <span class="r-item-title">${i.name || ''}</span>
                <span class="r-item-date" style="float:right;">${i.year || ''}</span>
                <div class="r-item-desc">${i.desc || ''}</div>
            </div>
        `), d.achievements.length > 0);

        const refHtml = buildSection('References', buildList(d.references, i => `
            <div class="r-item" style="margin-bottom:8px;">
                <div style="font-weight:700;">${i.name || ''}</div>
                <div>${i.company || ''}</div>
                <div style="font-size:9pt;">${i.contact || ''}</div>
            </div>
        `), d.references.length > 0);

        // Sidebar/Extra Content
        const skillsHtml = buildSection('Skills', buildPills(d.skills.text), d.skills.text.length > 0);
        const hobbiesHtml = buildSection('Hobbies', buildPills(d.hobbies.text), d.hobbies.text.length > 0);
        
        const certHtml = buildSection('Certifications', buildList(d.certifications, i => `
            <div style="margin-bottom:8px;">
                <div style="font-weight:600;">${i.name || ''}</div>
                <div style="font-size:9pt;">${i.issuer || ''} ${i.year ? '('+i.year+')' : ''}</div>
            </div>
        `), d.certifications.length > 0);

        const langHtml = buildSection('Languages', buildList(d.languages, i => `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span>${i.name || ''}</span>
                <span style="color:var(--r-muted); font-size:9pt;">${i.level || ''}</span>
            </div>
        `), d.languages.length > 0);

        // Determine if regions have data to apply display block
        const hasHeader = p.fullName || p.jobTitle || contactHtml;
        const hasMain = summaryHtml || expHtml || projHtml || achHtml || refHtml;
        const hasSidebar = skillsHtml || eduHtml || certHtml || langHtml || hobbiesHtml;

        c.innerHTML = `
            <header class="r-header ${hasHeader ? 'has-data' : ''}">
                ${p.photo ? `<img src="${p.photo}" class="r-photo"/>` : ''}
                <div class="r-header-text">
                    <div class="r-name">${p.fullName || 'YOUR NAME'}</div>
                    <div class="r-title">${p.jobTitle || 'Professional Title'}</div>
                    <div class="r-contact">${contactHtml}</div>
                </div>
            </header>

            <main class="r-content ${hasMain ? 'has-data' : ''}">
                ${summaryHtml}
                ${expHtml}
                ${eduHtml} ${projHtml}
                ${achHtml}
                ${refHtml}
            </main>

            <aside class="r-sidebar ${hasSidebar ? 'has-data' : ''}">
                ${skillsHtml}
                ${certHtml}
                ${langHtml}
                ${hobbiesHtml}
            </aside>
        `;
    }

    // --- UTILS & FEATURES ---
    zoom(change) {
        this.zoomLevel = Math.max(0.4, Math.min(2, this.zoomLevel + change));
        document.getElementById('resume-container').style.transform = `scale(${this.zoomLevel})`;
        document.getElementById('zoom-level').innerText = Math.round(this.zoomLevel * 100) + '%';
    }

    calculateScore() {
        let score = 0;
        const d = this.data;
        if (d.personal.fullName) score += 10;
        if (d.personal.email && d.personal.phone) score += 10;
        if (d.summary.text.length > 50) score += 15;
        if (d.experience.length > 0) score += 20;
        if (d.experience.length > 1) score += 10;
        if (d.education.length > 0) score += 15;
        if (d.skills.text.length > 10) score += 15;
        if (d.projects.length > 0 || d.certifications.length > 0) score += 5;

        const fill = document.getElementById('health-score-fill');
        const text = document.getElementById('health-score-text');
        fill.style.width = `${score}%`;
        text.innerText = `${score}%`;
        if(score > 80) fill.style.background = 'var(--success)';
        else if(score > 50) fill.style.background = 'var(--warning)';
        else fill.style.background = 'var(--theme-red)';
    }

    showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerText = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => {
            t.classList.remove('show');
            setTimeout(() => t.remove(), 300);
        }, 3000);
    }

    getFileName(ext) {
        const name = this.data.personal.fullName ? this.data.personal.fullName.replace(/\s+/g, '_') : 'My';
        return `${name}_Resume.${ext}`;
    }

    exportPDF() {
        this.showToast('Generating PDF (High Quality)...');
        const element = document.getElementById('resume-container');
        
        // Reset scale for proper export
        const oldScale = element.style.transform;
        element.style.transform = 'scale(1)';
        
        const qualityVal = parseInt(document.getElementById('export-quality').value);
        let scaleMultiplier = qualityVal === 1 ? 1.5 : (qualityVal === 3 ? 3 : 2);

        const opt = {
            margin:       0,
            filename:     this.getFileName('pdf'),
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: scaleMultiplier, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.style.transform = oldScale;
            this.showToast('PDF Exported Successfully!');
        });
    }

    exportImage(type) {
        this.showToast(`Generating ${type.toUpperCase()}...`);
        const element = document.getElementById('resume-container');
        const oldScale = element.style.transform;
        element.style.transform = 'scale(1)';

        const qualityVal = parseInt(document.getElementById('export-quality').value);
        let scaleMultiplier = qualityVal === 1 ? 1.5 : (qualityVal === 3 ? 3 : 2);

        html2canvas(element, { scale: scaleMultiplier, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = this.getFileName(type);
            link.href = canvas.toDataURL(`image/${type === 'jpg' ? 'jpeg' : 'png'}`, 0.98);
            link.click();
            element.style.transform = oldScale;
            this.showToast(`${type.toUpperCase()} Exported Successfully!`);
        });
    }
}

// Initialize Application
const app = new ResumeApp();

</script>
</body>
